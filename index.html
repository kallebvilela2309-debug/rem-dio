<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Dose Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #F5F7FA;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        .app-container {
            max-width: 550px;
            margin: 0 auto;
            background: #F5F7FA;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            background: white;
            padding: 20px 20px 12px;
            border-bottom: 1px solid #E0E0E0;
        }
        .app-header h1 {
            font-size: 1.8rem;
            color: #2F80ED;
        }
        .app-header p {
            font-size: 0.85rem;
            color: #828282;
            margin-top: 4px;
        }
        .aviso-permanente {
            background: #FFF3E0;
            padding: 8px 12px;
            font-size: 0.7rem;
            text-align: center;
            color: #ED6A2E;
            border-radius: 20px;
            margin-top: 10px;
        }
        .tab-bar {
            display: flex;
            background: white;
            border-top: 1px solid #E0E0E0;
            border-bottom: 1px solid #E0E0E0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-weight: 600;
            color: #828282;
            cursor: pointer;
            background: white;
            border: none;
            font-size: 1rem;
        }
        .tab.active {
            color: #2F80ED;
            border-bottom: 2px solid #2F80ED;
        }
        .page {
            display: none;
            padding: 20px 16px 80px;
            flex: 1;
        }
        .page.active {
            display: block;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #EDEDF0;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            border-left: 4px solid #2F80ED;
            padding-left: 12px;
            color: #1E2A3E;
        }
        input, select, textarea {
            background: #F5F7FA;
            border: 1px solid #E0E0E0;
            border-radius: 40px;
            padding: 12px 16px;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .weekdays {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .weekday-btn {
            background: #F2F2F6;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .weekday-btn.active {
            background: #2F80ED;
            color: white;
        }
        button {
            background: #2F80ED;
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button.btn-outline {
            background: transparent;
            border: 1px solid #2F80ED;
            color: #2F80ED;
        }
        button.btn-danger {
            background: #EB5757;
        }
        .schedule-item {
            background: #F5F7FA;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
            text-align: center;
        }
        .stat-card {
            background: #F5F7FA;
            border-radius: 20px;
            padding: 12px;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #2F80ED;
        }
        .analysis-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F5F7FA;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        .analysis-screen.active {
            display: block;
        }
        .interaction-alert {
            background: #EB5757;
            color: white;
            padding: 16px;
            border-radius: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .interaction-safe {
            background: #2F80ED20;
            color: #2F80ED;
            border: 1px solid #2F80ED;
        }
        .med-analysis-card {
            background: white;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .read-more {
            color: #2F80ED;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
        }
        .detailed-info {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #E0E0E0;
        }
        .resumo-texto {
            background: #F5F7FA;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 8px 0;
            white-space: pre-wrap;
        }
        .alarm-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 32px 32px 0 0;
            padding: 24px 20px 32px;
            z-index: 2000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: 0.3s;
        }
        .alarm-modal.show {
            transform: translateY(0);
        }
        .alarm-modal h2 {
            font-size: 1.8rem;
        }
        .btn-grande {
            background: #2F80ED;
            font-size: 1.3rem;
            padding: 16px;
            margin: 16px 0;
        }
        .btn-nao-tomar {
            background: #A0AAB5;
        }
        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>💊 Dose Inteligente</h1>
        <p>Alarmes inteligentes</p>
        <div class="aviso-permanente">⚠️ Este aplicativo não substitui orientação médica</div>
    </div>

    <div class="tab-bar">
        <button class="tab active" data-tab="inicio">Início</button>
        <button class="tab" data-tab="medicamentos">Medicamentos</button>
    </div>

    <div id="inicio" class="page active">
        <div class="card">
            <div class="card-title">📊 Estatísticas</div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number" id="totalEventos">0</div><div>Registros</div></div>
                <div class="stat-card"><div class="stat-number" id="taxaAcertos">0%</div><div>Adesão</div></div>
                <div class="stat-card"><div class="stat-number" id="tomadosHoje">0</div><div>Tomados hoje</div></div>
                <div class="stat-card"><div class="stat-number" id="ignoradosHoje">0</div><div>Ignorados</div></div>
            </div>
            <canvas id="graficoAdesao" style="margin-top: 16px; max-height: 160px;"></canvas>
        </div>
        <div class="card">
            <div class="card-title">⏰ Próximos horários</div>
            <div id="proximosContainer"></div>
        </div>
    </div>

    <div id="medicamentos" class="page">
        <div class="card">
            <div class="card-title">➕ Cadastrar medicamento(s)</div>
            <div id="medFormList"></div>
            <button id="addMedButton" class="btn-outline">+ Adicionar outro</button>
            <button id="saveMedsButton">💾 Salvar e iniciar alarmes</button>
        </div>
        <div class="card">
            <div class="card-title">📋 Seus medicamentos</div>
            <div id="medList"></div>
        </div>
    </div>
</div>

<script>
    // ==============================================================
    // DADOS GLOBAIS
    // ==============================================================
    let medicamentos = [];
    let eventosPendentes = [];
    let historico = [];
    let nextId = 1;
    let alarmesAtivos = new Map();
    let audioCtx = null;
    let grafico = null;

    // ==============================================================
    // FUNÇÕES AUXILIARES
    // ==============================================================
    function formatarTexto(texto) {
        if (!texto) return "";
        return texto.replace(/\n/g, '<br>');
    }

    // ==============================================================
    // PERSISTÊNCIA
    // ==============================================================
    function carregarDados() {
        try {
            medicamentos = JSON.parse(localStorage.getItem("dose_meds") || "[]");
            eventosPendentes = JSON.parse(localStorage.getItem("dose_eventos") || "[]");
            historico = JSON.parse(localStorage.getItem("dose_hist") || "[]");
            if (medicamentos.length) nextId = Math.max(...medicamentos.map(m => m.id), 0) + 1;
        } catch(e) {}
        atualizarTudo();
        reagendarAlarmes();
        renderizarListaMedicamentos();
    }
    
    function salvarDados() {
        localStorage.setItem("dose_meds", JSON.stringify(medicamentos));
        localStorage.setItem("dose_eventos", JSON.stringify(eventosPendentes));
        localStorage.setItem("dose_hist", JSON.stringify(historico));
        atualizarTudo();
        renderizarListaMedicamentos();
    }

    function registrarHistorico(medId, horario, status) {
        historico.push({ medicamentoId: medId, horario, status, timestamp: Date.now() });
        salvarDados();
    }

    // ==============================================================
    // ALARMES
    // ==============================================================
    function tocarSom() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 2);
            osc.stop(audioCtx.currentTime + 2);
        } catch(e) {}
        if (navigator.vibrate) navigator.vibrate([500, 300, 500]);
    }

    function mostrarModalAlarme(med, horario) {
        const modalExistente = document.getElementById("modalAlarmeAtivo");
        if (modalExistente) modalExistente.remove();
        
        const modal = document.createElement("div");
        modal.id = "modalAlarmeAtivo";
        modal.className = "alarm-modal";
        modal.innerHTML = `
            <h2>💊 ${med.nome}</h2>
            <p style="font-size:1.2rem; margin:8px 0;">Horário: ${horario}</p>
            <div class="resumo-texto">${formatarTexto(med.resumo || "Tome conforme orientação médica.")}</div>
            <button class="btn-grande" id="tomarBtn">✅ TOMAR AGORA</button>
            <button class="btn-nao-tomar" id="ignorarBtn">❌ NÃO TOMAR</button>
        `;
        document.body.appendChild(modal);
        setTimeout(() => modal.classList.add("show"), 10);
        
        const fechar = () => {
            modal.classList.remove("show");
            setTimeout(() => modal.remove(), 300);
        };
        
        document.getElementById("tomarBtn").onclick = () => {
            registrarHistorico(med.id, horario, "tomado");
            fechar();
        };
        
        document.getElementById("ignorarBtn").onclick = () => {
            registrarHistorico(med.id, horario, "ignorado");
            fechar();
        };
    }

    function reagendarAlarmes() {
        for (let [id, timeout] of alarmesAtivos) clearTimeout(timeout);
        alarmesAtivos.clear();
        
        const agora = new Date();
        for (let evento of eventosPendentes) {
            if (evento.tomado) continue;
            const med = medicamentos.find(m => m.id === evento.medicamentoId);
            if (!med) continue;
            
            const dataEvento = new Date(evento.dataReferencia);
            const tempoRestante = dataEvento.getTime() - agora.getTime();
            
            if (tempoRestante > 0) {
                const timeoutId = setTimeout(() => {
                    tocarSom();
                    if (Notification.permission === "granted") {
                        new Notification("Dose Inteligente", { body: `Hora de tomar ${med.nome}!` });
                    }
                    mostrarModalAlarme(med, evento.horario);
                }, tempoRestante);
                alarmesAtivos.set(evento.id, timeoutId);
            }
        }
    }

    // ==============================================================
    // GERADOR DE EVENTOS
    // ==============================================================
    function gerarHorarios(intervalo, inicio = "08:00") {
        if (intervalo === 0) return [inicio];
        let horarios = [];
        let [h, m] = inicio.split(":").map(Number);
        let mins = h * 60 + m;
        let totalHoras = 24;
        let qtde = totalHoras / intervalo;
        for (let i = 0; i < qtde; i++) {
            let total = (mins + i * intervalo * 60) % 1440;
            horarios.push(`${Math.floor(total/60).toString().padStart(2,'0')}:${(total%60).toString().padStart(2,'0')}`);
        }
        return [...new Set(horarios)].sort();
    }

    function gerarEventos(med) {
        const hoje = new Date();
        const novos = [];
        const diasNomes = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
        
        for (let i = 0; i < 14; i++) {
            const data = new Date();
            data.setDate(hoje.getDate() + i);
            const diaSemana = data.getDay();
            
            if (med.diasAtivos.includes(diaSemana)) {
                for (let horario of med.horarios) {
                    const [h, m] = horario.split(":").map(Number);
                    const dt = new Date(data);
                    dt.setHours(h, m, 0, 0);
                    
                    if (dt.getTime() > new Date().getTime()) {
                        const existe = eventosPendentes.some(e => 
                            e.medicamentoId === med.id && e.dataReferencia === dt.toISOString()
                        );
                        if (!existe) {
                            novos.push({
                                id: Date.now() + Math.random(),
                                medicamentoId: med.id,
                                horario: horario,
                                dataReferencia: dt.toISOString(),
                                tomado: false
                            });
                        }
                    }
                }
            }
        }
        
        eventosPendentes.push(...novos);
        eventosPendentes.sort((a,b) => new Date(a.dataReferencia) - new Date(b.dataReferencia));
        reagendarAlarmes();
        salvarDados();
    }

    // ==============================================================
    // RENDERIZAÇÃO DA UI
    // ==============================================================
    function atualizarTudo() {
        // Próximos eventos
        const futuros = eventosPendentes.filter(e => !e.tomado && new Date(e.dataReferencia) > new Date()).slice(0, 5);
        const proximosDiv = document.getElementById("proximosContainer");
        if (futuros.length === 0) {
            proximosDiv.innerHTML = "<div style='padding:16px;text-align:center'>Nenhum evento futuro</div>";
        } else {
            proximosDiv.innerHTML = futuros.map(e => {
                const med = medicamentos.find(m => m.id === e.medicamentoId);
                const data = new Date(e.dataReferencia);
                return `<div class="schedule-item">
                            <div><strong>${med?.nome}</strong></div>
                            <div>${data.toLocaleDateString()} ${e.horario}</div>
                        </div>`;
            }).join('');
        }
        
        // Estatísticas
        const total = historico.length;
        const tomados = historico.filter(h => h.status === "tomado").length;
        const taxa = total ? Math.round(tomados / total * 100) : 0;
        const hoje = new Date().toDateString();
        const tomadosHoje = historico.filter(h => h.status === "tomado" && new Date(h.timestamp).toDateString() === hoje).length;
        const ignoradosHoje = historico.filter(h => h.status === "ignorado" && new Date(h.timestamp).toDateString() === hoje).length;
        
        document.getElementById("totalEventos").innerText = total;
        document.getElementById("taxaAcertos").innerText = `${taxa}%`;
        document.getElementById("tomadosHoje").innerText = tomadosHoje;
        document.getElementById("ignoradosHoje").innerText = ignoradosHoje;
        
        // Gráfico
        const labels = [];
        const dados = [];
        for (let i = 6; i >= 0; i--) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            labels.push(d.toLocaleDateString());
            const count = historico.filter(h => h.status === "tomado" && new Date(h.timestamp).toDateString() === d.toDateString()).length;
            dados.push(count);
        }
        if (grafico) grafico.destroy();
        const ctx = document.getElementById("graficoAdesao").getContext("2d");
        grafico = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Tomados', data: dados, borderColor: '#2F80ED', tension: 0.3 }] }
        });
    }

    function renderizarListaMedicamentos() {
        const container = document.getElementById("medList");
        if (!medicamentos.length) {
            container.innerHTML = "<div style='text-align:center; padding:20px'>Nenhum medicamento cadastrado</div>";
            return;
        }
        container.innerHTML = medicamentos.map(med => `
            <div class="schedule-item">
                <div>
                    <strong>${med.nome}</strong> ${med.dosagem ? `(${med.dosagem})` : ''}<br>
                    <span style="font-size:0.7rem;">${med.horarios.join(", ")}</span>
                </div>
                <button class="btn-danger" style="width:auto; padding:6px 12px;" onclick="removerMed(${med.id})">Remover</button>
            </div>
        `).join('');
    }
    
    window.removerMed = (id) => {
        medicamentos = medicamentos.filter(m => m.id !== id);
        eventosPendentes = eventosPendentes.filter(e => e.medicamentoId !== id);
        historico = historico.filter(h => h.medicamentoId !== id);
        salvarDados();
        renderizarListaMedicamentos();
        reagendarAlarmes();
    };

    // ==============================================================
    // FORMULÁRIO DINÂMICO
    // ==============================================================
    function adicionarFormMed() {
        const container = document.getElementById("medFormList");
        const div = document.createElement("div");
        div.className = "med-item";
        div.style.background = "#F5F7FA";
        div.style.borderRadius = "20px";
        div.style.padding = "16px";
        div.style.marginBottom = "16px";
        div.innerHTML = `
            <div class="form-grid">
                <input type="text" placeholder="Nome do medicamento *" class="medNome">
                <input type="text" placeholder="Dosagem" class="medDosagem">
            </div>
            <input type="text" placeholder="Horários (ex: 08:00,14:00)" class="medHorarios">
            <select class="medIntervalo">
                <option value="0">-- Intervalo --</option>
                <option value="4">4h</option>
                <option value="6">6h</option>
                <option value="8">8h</option>
                <option value="12">12h</option>
                <option value="24">1x/dia</option>
            </select>
            <div class="weekdays">
                <span data-day="0" class="weekday-btn">Dom</span>
                <span data-day="1" class="weekday-btn">Seg</span>
                <span data-day="2" class="weekday-btn">Ter</span>
                <span data-day="3" class="weekday-btn">Qua</span>
                <span data-day="4" class="weekday-btn">Qui</span>
                <span data-day="5" class="weekday-btn">Sex</span>
                <span data-day="6" class="weekday-btn">Sáb</span>
            </div>
            <button class="remove-form-btn" style="background:#EB5757; margin-top:8px;">Remover</button>
        `;
        
        div.querySelectorAll(".weekday-btn").forEach(btn => {
            btn.onclick = e => {
                e.stopPropagation();
                btn.classList.toggle("active");
            };
        });
        div.querySelector(".remove-form-btn").onclick = () => div.remove();
        container.appendChild(div);
    }
    
    // ==============================================================
    // SALVAR MEDICAMENTOS
    // ==============================================================
    function salvarMedicamentos() {
        const forms = document.querySelectorAll("#medFormList .med-item");
        if (forms.length === 0) {
            alert("Adicione pelo menos um medicamento");
            return;
        }
        
        let salvos = 0;
        
        for (let form of forms) {
            const nome = form.querySelector(".medNome").value.trim();
            if (!nome) continue;
            
            const dosagem = form.querySelector(".medDosagem").value.trim();
            
            // Horários
            let horarios = [];
            const horariosStr = form.querySelector(".medHorarios").value.trim();
            if (horariosStr) {
                horarios = horariosStr.split(",").map(h => h.trim()).filter(h => h);
            }
            
            const intervalo = parseInt(form.querySelector(".medIntervalo").value);
            if (horarios.length === 0 && intervalo > 0) {
                horarios = gerarHorarios(intervalo);
            }
            if (horarios.length === 0) {
                horarios = ["08:00"];
            }
            
            // Dias da semana
            let diasAtivos = [];
            form.querySelectorAll(".weekday-btn.active").forEach(btn => {
                diasAtivos.push(parseInt(btn.dataset.day));
            });
            if (diasAtivos.length === 0) {
                diasAtivos = [0, 1, 2, 3, 4, 5, 6];
            }
            
            const novoMed = {
                id: nextId++,
                nome: nome,
                dosagem: dosagem,
                horarios: horarios,
                diasAtivos: diasAtivos,
                resumo: "Tome conforme orientação médica. Consulte a bula para mais informações."
            };
            
            medicamentos.push(novoMed);
            gerarEventos(novoMed);
            salvos++;
        }
        
        if (salvos === 0) {
            alert("Nenhum medicamento válido");
            return;
        }
        
        // Limpar formulário
        document.getElementById("medFormList").innerHTML = "";
        adicionarFormMed();
        
        alert(`${salvos} medicamento(s) cadastrado(s)! Os alarmes foram configurados.`);
    }

    // ==============================================================
    // INICIALIZAÇÃO
    // ==============================================================
    document.getElementById("addMedButton").onclick = adicionarFormMed;
    document.getElementById("saveMedsButton").onclick = salvarMedicamentos;
    
    document.querySelectorAll(".tab").forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById(tab.dataset.tab).classList.add("active");
        };
    });
    
    if (Notification.permission !== "granted") Notification.requestPermission();
    carregarDados();
    adicionarFormMed();
    console.log("✅ App iniciado com sucesso!");
</script>
</body>
</html>
